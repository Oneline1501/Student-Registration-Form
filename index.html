<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Form</title>

    <!-- add css file -->
<link href="./src/output.css" rel="stylesheet">
</head>

<body>

    <div class="flex flex-col  items-center mt-10">

        <!-- Heading -->
        <h1 class="text-3xl font-bold text-black-700 mb-10">
            STUDENT FORM
        </h1>

        <!-- FORM -->
        <form id="studentForm">

            <!-- Form Table-->
            <table class="border border-gray-500 border-collapse text-sm">

                <tr>
                    <td  class="border border-gray-400 px-9 py-3 font-bold ">
                        Name
                    </td>

                    <td class="border border-gray-400 px-9 py-3 ">
                        <input type="text" id="name" class="w-40 outline-none" required >
                    </td>
                </tr>

                <tr>
                    <td class="border border-gray-400  font-bold px-9 py-3">
                        Age
                    </td>

                    <td class="border border-gray-400 px-9 py-3 ">
                        <input type="number" id="age" class="w-40 outline-none" required >
                    </td>
                </tr>

                <tr>
                    <td class="border border-gray-400 px-9 py-3 font-bold ">Gender</td>

                    <td class="border border-gray-400 px-9 py-3">
                        <input type="radio" name="gender" value="Male" class="ml-3" required>Male
                        <input type="radio" name="gender" value="Female" class="ml-4">Female
                    </td>
                </tr>

                <tr>
                    <td class="border border-gray-400  font-bold px-9 py-3">
                        Course
                    </td>

                    <td class="border border-gray-400 px-9 py-3">
                        <select id="course" class="w-40 outline-none" required">
                            <option value="select">Select</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="Python">Python</option>
                            <option value="Java">Java</option>
                            <option value="HTML & CSS">HTML & CSS</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td class="border border-gray-400  font-bold px-9 py-3 "> E-mail</td>

                    <td class="border border-gray-400 px-9 py-3 ">
                        <input type="email" id="email" class="w-40 outline-none" required>
                    </td>
                </tr>

                <!-- Save Button -->
                <tr>
                    <td colspan="2" class="border border-gray-400 px-9 py-2">
                        <button type="submit" class="w-full bg-green-700 hover:bg-green-950 py-2 px-9 font-semibold">Save</button>
                    </td>
                </tr>

            </table>
        </form>

        <!-- OUTPUT TABLE -->
        <table class="border border-gray-500 border-collapse text-sm mt-7 "> 
            <thead>
                <tr class="bg-gray-100 ">

                    <th class="border border-gray-400 px-10 py-3">NAME</th>
                    <th class="border border-gray-400 p-10 py-3"> AGE </th>
                    <th class="border border-gray-400 px-10 py-3">COURSE</th>
                    <th class="border border-gray-400 px-10 py-3"> GENDER</th>
                   <th class="border border-gray-400 px-10 py-3">EMAIL </th>
                   <th class="border border-gray-400 px-10 py-3">ACTION</th>
 </tr>
            </thead>

            <!-- JavaScript will add rows here -->
            <tbody id="studentTable"></tbody>
</table>
 </div>

    <!-- JavaScript -->
    <script>
       const form = document.getElementById("studentForm");
        const studentTable = document.getElementById("studentTable");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

           <!--Get form values-->
          const name = document.getElementById("name").value;
            const age = document.getElementById("age").value;
            const course = document.getElementById("course").value;
            const email = document.getElementById("email").value;

            <!--Get gender-->
            const gender = document.querySelector('input[name="gender"]:checked').value;

            <!--Create new table row-->
            const row = document.createElement("tr");

            row.innerHTML = `<td class="border border-gray-400 px-10 py-3">${name}</td>

                <td class="border border-gray-400 px-10 py-3">${age}</td>
                <td class="border border-gray-400 px-10 py-3">${course}</td>
                <td class="border border-gray-400 px-10 py-3">${gender}</td>
               <td class="border border-gray-400 px-10 py-3"> ${email}</td>

                <td class="border border-gray-400 px-3 py-1">
                    <button onclick="deleteRow(this)" class="bg-red-600 text-white px-2 py-1">Delete</button>
                </td>           
                 `;
            <!--Add row to output table-->

            studentTable.appendChild(row);

            <!--Clear form-->
            form.reset();

        });


        <!--Delete row-->
        function deleteRow(button) {

            button.parentElement.parentElement.remove();

        }

    </script>

</body>
</html>
